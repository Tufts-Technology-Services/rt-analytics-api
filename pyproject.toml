[project]
name = "coldfront-interface-api"
version = "0.1.0"
description = "api for coldfront to interface with RT analytics database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "pwdlib[argon2]>=0.2.1",
    "sqlacodegen>=3.1.1",
    "sqlmodel>=0.0.34",
    "uvicorn>=0.39.0",
]

[project.scripts]
cf = "coldfront:main"

[project.optional-dependencies]
mysql = [
    "pymysql>=1.2.3",
]
postgres = [
    "psycopg[binary]>=3.2.13",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
# FastAPI's `Depends()` in argument defaults is the idiomatic pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# DATABASE_URL must be set before the app is imported, so imports can't stay at the top.
"tests/conftest.py" = ["E402"]
